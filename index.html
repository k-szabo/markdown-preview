<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Egyszerű, valós idejű Markdown előnézet."
    />
    <meta name="app-version" content="1.3.2" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <title>Markdown Preview</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("markdown-preview-theme");
        } catch (error) {
          console.warn("A mentett témabeállítás nem olvasható.", error);
        }
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <link rel="stylesheet" href="./assets/css/styles.css?v=1.3.2" />
    <script defer src="./assets/js/errorHandling.js?v=1.3.2"></script>
    <script defer src="./assets/js/dependencies.js?v=1.3.2"></script>
    <script defer src="./assets/js/markdown.js?v=1.3.2"></script>
    <script defer src="./assets/js/renderer.js?v=1.3.2"></script>
    <script defer src="./assets/js/app.js?v=1.3.2"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <a class="brand" href="./" aria-label="Markdown Preview főoldal">
          <span class="brand-mark" aria-hidden="true">M↓</span>
          <span>Markdown Preview</span>
          <span id="app-version" class="version-label"></span>
        </a>
        <p>Írd vagy illeszd be a Markdown szöveget, és nézd meg az előnézetet.</p>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-pressed="false"
          aria-label="Sötét mód bekapcsolása"
        >
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="theme-label">Sötét mód</span>
        </button>
      </header>

      <div class="workspace-toolbar">
        <span class="view-label">Nézet</span>
        <div class="view-controls" role="group" aria-label="Megjelenített panelek">
          <button type="button" data-view="editor" aria-pressed="false">
            Csak szerkesztő
          </button>
          <button type="button" data-view="split" aria-pressed="true">
            Mindkettő
          </button>
          <button type="button" data-view="preview" aria-pressed="false">
            Csak előnézet
          </button>
        </div>
      </div>

      <section
        class="workspace"
        data-view="split"
        aria-label="Markdown szerkesztő és előnézet"
      >
        <section class="panel editor-panel" aria-labelledby="editor-heading">
          <div class="panel-header">
            <h1 id="editor-heading">Markdown</h1>
            <span class="panel-hint">Szerkesztő</span>
          </div>
          <label class="sr-only" for="markdown-input">Markdown szöveg</label>
          <textarea
            id="markdown-input"
            spellcheck="false"
            placeholder="# Helló, Markdown!

Írj ide, vagy illessz be egy Markdown szöveget.

**Félkövér**, *dőlt*, [link](https://example.com)

- Első listaelem
- Második listaelem

További példák a README-ben: képletek, lábjegyzetek, grafikonok és Graphviz.

```mermaid
flowchart LR
    A[Markdown] --> B[Előnézet]
```

```js
console.log('Helló, világ!');
```"
          ></textarea>
        </section>

        <div
          class="workspace-divider"
          role="separator"
          aria-label="Panelek méretének módosítása"
          aria-orientation="vertical"
          aria-valuemin="20"
          aria-valuemax="80"
          aria-valuenow="50"
          tabindex="0"
        ></div>

        <section class="panel preview-panel" aria-labelledby="preview-heading">
          <div class="panel-header">
            <h2 id="preview-heading">Előnézet</h2>
            <span class="panel-hint">Élő nézet</span>
          </div>
          <div
            id="markdown-preview"
            class="markdown-body"
            aria-live="polite"
          ></div>
        </section>
      </section>
      <footer class="app-footer">
        A Markdown tartalom feldolgozása helyben, a böngésződben történik.
        <a href="https://github.com/k-szabo/markdown-preview">
          Forráskód a GitHubon
        </a>
      </footer>
    </main>
  </body>
</html>
