<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Egyszerű, valós idejű Markdown előnézet."
    />
    <meta name="app-version" content="1.1.0" />
    <title>Markdown Preview</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <a class="brand" href="./" aria-label="Markdown Preview főoldal">
          <span class="brand-mark" aria-hidden="true">M↓</span>
          <span>Markdown Preview</span>
          <span id="app-version" class="version-label"></span>
        </a>
        <p>Írd vagy illeszd be a Markdown szöveget, és nézd meg az előnézetet.</p>
      </header>

      <section class="workspace" aria-label="Markdown szerkesztő és előnézet">
        <section class="panel editor-panel" aria-labelledby="editor-heading">
          <div class="panel-header">
            <h1 id="editor-heading">Markdown</h1>
            <span class="panel-hint">Szerkesztő</span>
          </div>
          <label class="sr-only" for="markdown-input">Markdown szöveg</label>
          <textarea
            id="markdown-input"
            spellcheck="false"
            placeholder="# Helló, Markdown!

Írj ide, vagy illessz be egy Markdown szöveget.

**Félkövér**, *dőlt*, [link](https://example.com)

- Első listaelem
- Második listaelem

További példák a README-ben: képletek, lábjegyzetek, grafikonok és Graphviz.

```mermaid
flowchart LR
    A[Markdown] --> B[Előnézet]
```

```js
console.log('Helló, világ!');
```"
          ></textarea>
        </section>

        <section class="panel preview-panel" aria-labelledby="preview-heading">
          <div class="panel-header">
            <h2 id="preview-heading">Előnézet</h2>
            <span class="panel-hint">Élő nézet</span>
          </div>
          <div
            id="markdown-preview"
            class="markdown-body"
            aria-live="polite"
          ></div>
        </section>
      </section>
      <footer class="app-footer">
        A Markdown tartalom feldolgozása helyben, a böngésződben történik.
      </footer>
    </main>
  </body>
</html>
